name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Django backend — system check, migrations, tests
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test-backend:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: lostfound_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\" --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'django-insecure-ci-only-test-key-do-not-use-in-production-abc123' }}
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_NAME: lostfound_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      MONGO_URI: "mongodb://localhost:27017/"
      MONGO_DB_NAME: lostfound_items
      REDIS_URL: "redis://localhost:6379/0"
      ELASTICSEARCH_HOST: "http://localhost:9200"
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: changeme
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_STORAGE_BUCKET_NAME: dummy-bucket
      AWS_S3_REGION_NAME: ap-south-1
      CELERY_BROKER_URL: "redis://localhost:6379/1"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/2"
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "60"
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: "7"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r backend/requirements.txt

      - name: Prepare working directories
        run: mkdir -p backend/logs backend/media backend/staticfiles

      - name: Django system check
        working-directory: backend
        run: python manage.py check --deploy 2>&1 | grep -v "WARNINGS" || true
        # --deploy raises warnings (HTTPS, HSTS) expected in CI — not errors

      - name: Django system check (strict)
        working-directory: backend
        run: python manage.py check

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Seed default accounts
        working-directory: backend
        run: python manage.py create_defaults

      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity=2

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: User frontend build check (TypeScript + Vite)
# ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: TypeScript + Vite build
        working-directory: frontend
        run: npm run build

# ─────────────────────────────────────────────────────────────────────────────
# Job 3: Admin panel build check (TypeScript + Vite)
# ─────────────────────────────────────────────────────────────────────────────
  build-admin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm install

      - name: TypeScript + Vite build
        working-directory: admin
        run: npm run build

# ─────────────────────────────────────────────────────────────────────────────
# Job 4: Docker image build verification
# ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          build-args: |
            INSTALL_AI=false
          tags: lostfound-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
