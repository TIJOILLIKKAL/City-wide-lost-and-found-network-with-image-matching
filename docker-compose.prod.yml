# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Before first deploy:
#   1. Copy backend/.env.example → backend/.env.prod and fill in real values
#   2. Set DEBUG=False, ALLOWED_HOSTS=yourdomain.com in .env.prod
#   3. Set real SECRET_KEY, DB_PASSWORD, Elasticsearch password, AWS credentials

version: "3.9"

x-backend-prod: &backend-prod
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      INSTALL_AI: "true"
  env_file:
    - ./backend/.env.prod
  # No bind mount — use the built image as-is
  volumes: []
  restart: always

services:
  # ── Django ASGI (gunicorn + uvicorn workers) ────────────────────────────────
  backend:
    <<: *backend-prod
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    # No command override — Dockerfile CMD runs gunicorn
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports: []  # nginx handles external traffic; backend not exposed directly
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── Celery worker ───────────────────────────────────────────────────────────
  celery:
    <<: *backend-prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: []
    command: celery -A config worker --loglevel=info --concurrency=4

  # ── Celery beat scheduler ───────────────────────────────────────────────────
  celery-beat:
    <<: *backend-prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: []
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      # Uncomment to add TLS certificates:
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  # ── Databases (production-tuned) ────────────────────────────────────────────
  db:
    restart: always
    environment:
      POSTGRES_DB: lostfound_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
    # No external port exposure in production
    ports: []

  mongo:
    restart: always
    ports: []

  redis:
    restart: always
    ports: []
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"

  elasticsearch:
    restart: always
    ports: []

volumes:
  static_files:
  media_files:
